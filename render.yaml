services:
  - type: web
    name: hostguide
    runtime: python
    buildCommand: apt-get update && apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2 && pip install -r requirements.txt && playwright install --with-deps chromium chromium-headless-shell && ls -la /opt/render/.cache/ms-playwright/
    startCommand: cd /opt/render/project/src && (test -d /opt/render/.cache/ms-playwright/chromium_headless_shell-1208 || playwright install chromium chromium-headless-shell) && gunicorn src.app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: HOSTGUIDE_DOMAIN
        value: https://host-guide.net
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: HOSTGUIDE_ADMIN_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: tuto-redis
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  # iCal sync - polls all hosts' booking calendars every 30 min so guide
  # personalization stays current. Per MIE V9 SI-1: this auto-update is the
  # standalone-vs-PMS-bundled differentiator.
  - type: cron
    name: hostguide-ical-sync
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.ical_sync --all
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  # Pre-arrival emails - daily 8am UTC, finds bookings starting in 3 days,
  # outputs JSON list of {listing_id, booking, action} to logs (stdout).
  # Wire to your email service by piping to a sender script.
  - type: cron
    name: hostguide-pre-arrival
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.ical_sync --pre-arrival 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2

  # Post-checkout review nudges - daily 9am UTC, finds bookings that checked
  # out yesterday. Same JSON-to-stdout pattern as pre-arrival.
  - type: cron
    name: hostguide-review-nudge
    runtime: python
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.ical_sync --post-checkout 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
